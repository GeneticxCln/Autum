[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autum"
version = "0.1.0"
description = "Local voice-first assistant"
requires-python = ">=3.12"
# The core runtime uses only the standard library. Model, audio, and presence
# dependencies belong to the optional components that use them.
dependencies = []

[project.scripts]
autum = "autum.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "."]
