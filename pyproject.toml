[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autum"
version = "1.1.0"
description = "Local, model-agnostic voice-first AI desktop assistant"
readme = "README.md"
requires-python = ">=3.12"
# The core runtime uses only the standard library; full desktop & voice deps are in [project.optional-dependencies].
dependencies = []

[project.optional-dependencies]
desktop = [
    "httpx>=0.27",
    "numpy>=1.26",
    "PySide6>=6.7",
    "faster-whisper>=1.1",
]

[project.urls]
Homepage = "https://github.com/GeneticxCln/Autum"
Repository = "https://github.com/GeneticxCln/Autum"
Issues = "https://github.com/GeneticxCln/Autum/issues"

[project.scripts]
autum = "autum.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"autum.presence" = ["*.qml", "*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "."]
