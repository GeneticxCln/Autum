name: CI

on:
  push:
    branches: [main, m0-runtime-m1-benchmark]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt offscreen system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libfontconfig1

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest scipy ".[desktop]"

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python3 -m pytest -q
